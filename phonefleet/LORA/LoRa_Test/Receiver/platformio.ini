;LoRa_Test - RECEIVER (Arduino Mega 2560 #2)

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 115200
; If both Megas are plugged into the same PC, set the port of THIS board
; (list the ports with: pio device list)
upload_port = COM7
monitor_port = COM7

lib_deps =
    ; Grove LoRa library (same RH_RF95 as BoxCo_Client / BoxCo_Server).
    ; Keep the 2.0.0 tag: newer versions do not compile for the Mega (AVR).
    https://github.com/Seeed-Studio/Grove_LoRa_433MHz_and_915MHz_RF.git#2.0.0
